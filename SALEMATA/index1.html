<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salemata - Produits Locaux</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:#f5f5f0; }

    header { display:flex; justify-content:space-between; align-items:center; padding:20px 50px; background:white; border-radius:20px; margin:20px; }

    .btn { background:#2e5d34; color:white; padding:10px 20px; border-radius:20px; cursor:pointer; border:none; }

    .products { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:20px; padding:20px; }

    .card { background:white; padding:20px; border-radius:20px; text-align:center; }

    .card img { width:100%; height:180px; object-fit:cover; border-radius:15px; }

    #cart {
      position:fixed;
      right:20px;
      bottom:20px;
      background:#2e5d34;
      color:white;
      padding:15px;
      border-radius:50%;
      cursor:pointer;
    }

    #cartBox {
      position:fixed;
      right:20px;
      bottom:80px;
      width:300px;
      background:white;
      padding:20px;
      border-radius:15px;
      display:none;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    #cartBox ul { list-style:none; margin:10px 0; }

  </style>
</head>
<body>

<header>
  <h2>Salemata</h2>
  <button onclick="toggleCart()" class="btn">🛒 Panier</button>
</header>

<section class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1604908176997-4310e8e07b7c">
    <h3>Huile de coco</h3>
    <p>5000 FCFA</p>
    <button class="btn" onclick="addToCart('Huile de coco', 5000)">Ajouter</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1590080877777-4c4b6b1a7b65">
    <h3>Bissap</h3>
    <p>3000 FCFA</p>
    <button class="btn" onclick="addToCart('Bissap', 3000)">Ajouter</button>
  </div>

</section>

<div id="cart">🛒</div>

<div id="cartBox">
  <h3>Panier</h3>
  <ul id="cartItems"></ul>
  <p id="total"></p>
  <button class="btn" onclick="orderWhatsApp()">Commander</button>
</div>

<script>
  let cart = [];

  function addToCart(name, price) {
    cart.push({name, price});
    alert(name + ' ajouté au panier');
  }

  function toggleCart() {
    const box = document.getElementById('cartBox');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
    displayCart();
  }

  function displayCart() {
    const list = document.getElementById('cartItems');
    const totalEl = document.getElementById('total');
    list.innerHTML = '';
    let total = 0;

    cart.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item.name + ' - ' + item.price + ' FCFA';
      list.appendChild(li);
      total += item.price;
    });

    totalEl.textContent = 'Total: ' + total + ' FCFA';
  }

  function orderWhatsApp() {
    let message = 'Commande:%0A';
    cart.forEach(item => {
      message += item.name + ' - ' + item.price + ' FCFA%0A';
    });
    window.open('https://wa.me/221XXXXXXXXX?text=' + message);
  }
</script>

</body>
</html>
